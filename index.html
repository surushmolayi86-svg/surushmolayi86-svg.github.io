<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>REN. — Building My Future</title>

    <meta
        name="description"
        content="REN. — An IT student building skills in web development, AI, SEO, copywriting and personal branding."
    >

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #070812;
            color: #f5f5fa;
            line-height: 1.6;
            overflow-x: hidden;
        }

        body.menu-open {
            overflow: hidden;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        button {
            font: inherit;
        }

        .container {
            width: min(90%, 1120px);
            margin: auto;
        }

        /* =========================
           NAVBAR
        ========================= */

        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            border-bottom: 1px solid rgba(255,255,255,0.07);
            background: rgba(7,8,18,0.82);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
        }

        .nav-inner {
            min-height: 72px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 4px;
        }

        .desktop-links {
            display: flex;
            align-items: center;
            gap: 28px;
            list-style: none;
        }

        .desktop-links a {
            color: #a8aabb;
            font-size: 14px;
            transition: 0.3s;
        }

        .desktop-links a:hover {
            color: white;
        }

        .nav-button {
            display: none;
            border: 0;
            background: transparent;
            color: white;
            font-size: 30px;
            cursor: pointer;
        }

        /* =========================
           MOBILE MENU
        ========================= */

        .mobile-menu {
            position: fixed;
            inset: 72px 0 0 0;
            z-index: 999;
            background: rgba(7,8,18,0.98);
            padding: 35px 25px;
            transform: translateX(100%);
            transition: 0.35s ease;
        }

        .mobile-menu.active {
            transform: translateX(0);
        }

        .mobile-menu a {
            display: block;
            padding: 18px 0;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            color: #d4d5df;
            font-size: 20px;
        }

        /* =========================
           HERO
        ========================= */

        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            position: relative;
            overflow: hidden;
            padding-top: 72px;

            background:
                radial-gradient(
                    circle at 10% 20%,
                    rgba(91, 67, 210, 0.27),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 90% 70%,
                    rgba(35, 93, 220, 0.20),
                    transparent 38%
                );
        }

        .hero::before {
            content: "";
            position: absolute;
            width: 350px;
            height: 350px;
            border-radius: 50%;
            border: 1px solid rgba(130,110,255,0.12);
            right: -130px;
            top: 15%;
        }

        .hero-content {
            position: relative;
            z-index: 2;
            max-width: 850px;
        }

        .eyebrow {
            color: #8d91aa;
            text-transform: uppercase;
            letter-spacing: 4px;
            font-size: 13px;
            margin-bottom: 24px;
        }

        .hero h1 {
            font-size: clamp(72px, 16vw, 160px);
            line-height: 0.85;
            letter-spacing: -8px;
            margin-bottom: 35px;
        }

        .gradient {
            background: linear-gradient(
                100deg,
                #6b7cff,
                #a65cff
            );
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .hero h2 {
            font-size: clamp(28px, 5vw, 52px);
            line-height: 1.08;
            max-width: 800px;
            margin-bottom: 24px;
            letter-spacing: -1.5px;
        }

        .hero-description {
            color: #a5a7b7;
            max-width: 650px;
            font-size: 17px;
            margin-bottom: 35px;
        }

        .buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 13px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 50px;
            padding: 0 22px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            transition: 0.3s;
        }

        .btn-primary {
            background: linear-gradient(
                100deg,
                #596cff,
                #964eff
            );
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(100,80,255,0.22);
        }

        .btn-secondary {
            border: 1px solid rgba(255,255,255,0.12);
            color: #d8d9e3;
        }

        .btn-secondary:hover {
            background: rgba(255,255,255,0.06);
            transform: translateY(-3px);
        }

        /* =========================
           STRIP
        ========================= */

        .strip {
            border-top: 1px solid rgba(255,255,255,0.07);
            border-bottom: 1px solid rgba(255,255,255,0.07);
            padding: 21px 0;
            overflow: hidden;
        }

        .strip-content {
            white-space: nowrap;
            text-align: center;
            color: #85889b;
            font-size: 12px;
            letter-spacing: 4px;
        }

        /* =========================
           SECTIONS
        ========================= */

        section {
            padding: 115px 0;
        }

        .section-label {
            color: #7e88ff;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 17px;
        }

        .section-title {
            font-size: clamp(38px, 6vw, 68px);
            line-height: 1;
            letter-spacing: -2.5px;
            max-width: 850px;
            margin-bottom: 24px;
        }

        .section-description {
            color: #9fa1b1;
            max-width: 720px;
            font-size: 17px;
        }

        /* =========================
           REVEAL ANIMATION
        ========================= */

        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition:
                opacity 0.7s ease,
                transform 0.7s ease;
        }

        .reveal.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* =========================
           ABOUT CARDS
        ========================= */

        .cards {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-top: 55px;
        }

        .card {
            padding: 32px;
            border-radius: 22px;
            border: 1px solid rgba(255,255,255,0.08);
            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,0.055),
                    rgba(255,255,255,0.018)
                );
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-6px);
            border-color: rgba(120,120,255,0.25);
        }

        .card-number {
            color: #717cff;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 17px;
        }

        .card h3 {
            font-size: 27px;
            margin-bottom: 12px;
        }

        .card p {
            color: #9ea0ae;
        }

        /* =========================
           SKILLS
        ========================= */

        .skills {
            display: flex;
            flex-wrap: wrap;
            gap: 11px;
            margin-top: 45px;
        }

        .skill {
            padding: 12px 17px;
            border-radius: 50px;
            border: 1px solid rgba(255,255,255,0.10);
            background: rgba(255,255,255,0.025);
            color: #c9cad4;
            transition: 0.3s;
        }

        .skill:hover {
            transform: translateY(-3px);
            border-color: rgba(120,120,255,0.35);
        }

        /* =========================
           STACK
        ========================= */

        .stack-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            margin-top: 55px;
        }

        .stack-item {
            padding: 27px;
            border-radius: 18px;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.025);
        }

        .stack-item h3 {
            margin-bottom: 9px;
            font-size: 20px;
        }

        .stack-item p {
            color: #9295a5;
            font-size: 14px;
        }

        /* =========================
           TIMELINE
        ========================= */

        .timeline {
            margin-top: 60px;
            border-left: 1px solid rgba(112,120,255,0.35);
            padding-left: 31px;
        }

        .timeline-item {
            position: relative;
            margin-bottom: 52px;
        }

        .timeline-item:last-child {
            margin-bottom: 0;
        }

        .timeline-item::before {
            content: "";
            position: absolute;
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background: #737eff;
            left: -37px;
            top: 7px;
            box-shadow: 0 0 18px rgba(115,126,255,0.7);
        }

        .timeline-year {
            color: #727dff;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 7px;
        }

        .timeline-item h3 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .timeline-item p {
            color: #999cab;
            max-width: 690px;
        }

        /* =========================
           PROJECTS
        ========================= */

        .project-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-top: 55px;
        }

        .project {
            min-height: 260px;
            padding: 30px;
            border-radius: 22px;
            border: 1px solid rgba(255,255,255,0.08);
            background:
                radial-gradient(
                    circle at top right,
                    rgba(105,70,230,0.14),
                    transparent 40%
                ),
                rgba(255,255,255,0.025);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: 0.3s;
        }

        .project:hover {
            transform: translateY(-6px);
        }

        .project-tag {
            color: #858cff;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 2px;
        }

        .project h3 {
            font-size: 28px;
            margin: 30px 0 10px;
        }

        .project p {
            color: #989aaa;
        }

        .project-status {
            margin-top: 25px;
            color: #777a8c;
            font-size: 13px;
        }

        /* =========================
           VISION
        ========================= */

        .vision-box {
            margin-top: 55px;
            padding: 58px;
            border-radius: 28px;
            border: 1px solid rgba(255,255,255,0.08);
            background:
                radial-gradient(
                    circle at top right,
                    rgba(145,70,255,0.18),
                    transparent 42%
                ),
                radial-gradient(
                    circle at bottom left,
                    rgba(60,90,255,0.15),
                    transparent 45%
                ),
                rgba(255,255,255,0.025);
        }

        .vision-box h3 {
            font-size: clamp(34px, 6vw, 63px);
            line-height: 1;
            letter-spacing: -2px;
            margin-bottom: 23px;
        }

        .vision-box p {
            color: #a0a2b1;
            max-width: 740px;
        }

        /* =========================
           GOALS
        ========================= */

        .goals {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            margin-top: 50px;
        }

        .goal {
            padding: 27px;
            border-radius: 18px;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.025);
        }

        .goal strong {
            display: block;
            font-size: 30px;
            margin-bottom: 8px;
            background: linear-gradient(90deg,#687aff,#a45aff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .goal span {
            color: #989aaa;
            font-size: 14px;
        }

        /* =========================
           QUOTE
        ========================= */

        .quote {
            text-align: center;
            padding: 125px 20px;
        }

        .quote-text {
            max-width: 900px;
            margin: auto;
            font-size: clamp(34px, 6vw, 68px);
            font-weight: 900;
            line-height: 1.05;
            letter-spacing: -2px;
        }

        .quote-author {
            display: block;
            margin-top: 27px;
            color: #77798a;
            font-size: 13px;
            letter-spacing: 3px;
        }

        /* =========================
           CONTACT
        ========================= */

        .contact {
            text-align: center;
        }

        .contact .section-description {
            margin: 0 auto 35px;
        }

        .linkedin-btn {
            display: inline-flex;
            align-items: center;
            gap: 11px;
            padding: 15px 24px;
            border-radius: 12px;
            background: #0a66c2;
            font-weight: 800;
            transition: 0.3s;
        }

        .linkedin-btn:hover {
            transform: translateY(-3px);
            background: #0875dd;
        }

        .linkedin-icon {
            width: 25px;
            height: 25px;
            border-radius: 5px;
            background: white;
            color: #0a66c2;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            font-weight: 900;
        }

        /* =========================
           FOOTER
        ========================= */

        footer {
            border-top: 1px solid rgba(255,255,255,0.07);
            padding: 35px 0;
            color: #6f7181;
            font-size: 13px;
        }

        .footer-inner {
            display: flex;
            justify-content: space-between;
            gap: 20px;
        }

        /* =========================
           BACK TO TOP
        ========================= */

        #topButton {
            position: fixed;
            right: 20px;
            bottom: 20px;
            z-index: 500;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(20,21,35,0.9);
            color: white;
            cursor: pointer;
            opacity: 0;
            visibility: hidden;
            transform: translateY(15px);
            transition: 0.3s;
        }

        #topButton.visible {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 800px) {

            .desktop-links {
                display: none;
            }

            .nav-button {
                display: block;
            }

            .hero {
                min-height: 92vh;
            }

            .hero h1 {
                letter-spacing: -5px;
            }

            section {
                padding: 85px 0;
            }

            .cards,
            .project-grid {
                grid-template-columns: 1fr;
            }

            .stack-grid {
                grid-template-columns: 1fr;
            }

            .goals {
                grid-template-columns: 1fr;
            }

            .vision-box {
                padding: 32px;
            }

            .quote {
                padding: 90px 15px;
            }

            .footer-inner {
                flex-direction: column;
            }
        }

        @media (max-width: 500px) {

            .container {
                width: 88%;
            }

            .hero-description,
            .section-description {
                font-size: 15px;
            }

            .buttons {
                flex-direction: column;
                align-items: stretch;
            }

            .btn {
                width: 100%;
            }

            .card,
            .project {
                padding: 25px;
            }
        }
    </style>
</head>
